name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger otomatis saat push tag seperti v1.2.0, v1.3.0

permissions:
  contents: write  # Izin untuk membuat GitHub Release dan upload APK

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app  # Flutter app ada di subfolder app/
    
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # 3. Setup Flutter (gunakan channel stable)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # 4. Install Flutter dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # 5. Generate .env file dari GitHub Secrets (wajib untuk Envied)
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      
      # 6. Run build_runner untuk generate env.g.dart
      - name: Run code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
      
      # 7. Build Universal Release APK (kompatibel untuk semua HP Android)
      - name: Build Universal APK
        run: flutter build apk --release
      
      # 8. Extract Version & Build Number dari pubspec.yaml
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Build $BUILD_NUMBER)"
      
      # 9. Hitung SHA-256 Checksum untuk keamanan
      - name: Calculate checksum
        id: checksums
        run: |
          UNIVERSAL_CHECKSUM=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')
          echo "UNIVERSAL_CHECKSUM=$UNIVERSAL_CHECKSUM" >> $GITHUB_OUTPUT
          echo "SHA-256: $UNIVERSAL_CHECKSUM"
      
      # 10. Buat GitHub Release & Upload file APK
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## 📱 Mangan Group App v${{ steps.version.outputs.VERSION }}
            **Build Number:** ${{ steps.version.outputs.BUILD_NUMBER }}
            
            ### 📥 Download:
            - **Universal APK:** [app-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk)
            
            ### 🔒 SHA-256 Checksum:
            `${{ steps.checksums.outputs.UNIVERSAL_CHECKSUM }}`
            
            ---
            *Otomatis di-build dan dirilis via GitHub Actions.*
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 11. Daftarkan URL GitHub Release ke database Supabase agar app mendeteksi update
      - name: Update Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"
          
          curl -X POST "$SUPABASE_URL/rest/v1/app_releases" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{
              "version": "${{ steps.version.outputs.VERSION }}",
              "build_number": ${{ steps.version.outputs.BUILD_NUMBER }},
              "download_url": "'"$DOWNLOAD_URL"'",
              "sha256_checksum": "${{ steps.checksums.outputs.UNIVERSAL_CHECKSUM }}",
              "release_notes": "Pembaruan otomatis versi ${{ steps.version.outputs.VERSION }}",
              "force_update": false
            }'
          
          echo "✅ Berhasil mendaftarkan rilis baru ke Supabase!"
