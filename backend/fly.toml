# Fly.io — Mangansage API (Laravel + FrankenPHP)
# Reuses the existing FrankenPHP Dockerfile (CMD /start.sh serves Laravel on :8000).
# Deploy:  fly deploy --config fly.toml
app = "mangansage-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_NAME = ":8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
