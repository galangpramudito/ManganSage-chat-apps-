app = "mangansage-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# FrankenPHP listens on SERVER_NAME; set to :8080 to match internal_port below.
[env]
  SERVER_NAME = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
