app = "mangansage-reverb"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_NAME = ":8080"
  APP_ENV = "production"
  APP_DEBUG = "false"
  DB_CONNECTION = "pgsql"
  DB_PORT = "5432"
  DB_SSLMODE = "require"
  BROADCAST_CONNECTION = "reverb"
  REVERB_HOST = "0.0.0.0"
  REVERB_PORT = "8080"
  REVERB_SCHEME = "http"
  QUEUE_CONNECTION = "sync"
  CACHE_STORE = "file"
  SESSION_DRIVER = "file"

[experimental]
  cmd = ["/reverb.sh"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
